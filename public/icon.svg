<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
     viewBox="0 0 512 512" xml:space="preserve">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d676" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#16161b" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#darkGrad)" />

  <!-- Faint gold ring -->
  <rect x="16" y="16" width="480" height="480" rx="84" ry="84"
        fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.35" />

  <!-- Stylized geometric "A" matching AURIENTA brand logo -->
  <g>
    <path fill="url(#goldGrad)"
          d="M384,392 L296,392 L272,332 L192,332 L168,392 L84,392 L208,104 L260,104 L384,392 Z M248,184 L216,272 L248,272 L248,184 Z" />
    <!-- Curved arc above the A — echoing the logo arc -->
    <path fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"
          d="M150,200 Q256,90 362,200" opacity="0.8" />
    <!-- Five-pointed star accent -->
    <polygon fill="url(#goldGrad)"
             points="256,300 263,318 283,318 267,330 273,349 256,338 239,349 245,330 229,318 249,318" />
  </g>
</svg>
